<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management SPA</title>
    <!-- Link to your local bootstrap file inside public/ -->
    <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <!-- Main Application Header Section -->
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="text-dark m-0">Order Management SPA</h1>
            <span id="timestamp" class="text-muted small fw-bold">Not updated yet</span>
        </header>

        <div class="row">
            <!-- Left Side: Order Input Form -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0 fw-bold">Order Details</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="order-form">
                            <div class="mb-3">
                                <label for="orderDesc" class="form-label fw-bold small text-muted text-uppercase">Order Description</label>
                                <input type="text" class="form-control" id="orderDesc" required placeholder="e.g., Wireless Mouse">
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label fw-bold small text-muted text-uppercase">Quantity</label>
                                <input type="number" class="form-control" id="quantity" min="1" required placeholder="1">
                            </div>
                            <div class="mb-3">
                                <label for="unitCost" class="form-label fw-bold small text-muted text-uppercase">Unit Cost ($)</label>
                                <input type="number" class="form-control" id="unitCost" step="0.01" min="0.00" required placeholder="0.00">
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold text-uppercase mt-2">Submit Order</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Side: Orders Data Table Display -->
            <div class="col-md-8 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold">Active Orders</h5>
                        <button id="refresh-btn" class="btn btn-sm btn-outline-light px-3 fw-bold text-uppercase">Refresh Orders</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-dark">
                                    <!-- Horizontal fields across the top -->
                                    <tr>
                                        <th class="ps-3">Order ID</th>
                                        <th>Description</th>
                                        <th class="text-end">Quantity</th>
                                        <th class="text-end">Unit Cost</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="orders-table-body">
                                    <!-- Values map downward underneath fields here -->
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Click refresh to load orders...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link to your local JavaScript interaction engine -->
    <script src="orders.js"></script>
</body>
</html>
